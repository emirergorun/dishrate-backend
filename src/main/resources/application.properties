# ============================================================
# Decouva API ayarları (2.13)
# ------------------------------------------------------------
# Bu dosya repoda ve içinde SIR YOK. Sırlar ${...} yer tutucularıyla
# dışarıdan gelir:
#   - sunucuda: platformun ortam değişkenleri (DB_URL, JWT_SECRET, ...)
#   - geliştirmede: proje kökündeki application-local.properties
#     (.gitignore'da; şablonu application-local.properties.example)
# Yerel dosya varsa değerleri buradakilerin üstüne yazar. Buradaki
# varsayılanlar üretime göre seçildi (örnek veri kapalı, sade log).
# ============================================================
spring.config.import=optional:file:./application-local.properties

# SUNUCU — platformlar portu PORT değişkeniyle verir
server.port=${PORT:8080}
server.servlet.context-path=/api/v1
# Vekil arkasında gerçek istemci IP'si (2.9): Tomcat X-Forwarded-For'u yalnız
# güvenilen vekilden gelirse okur (varsayılan: özel ağ aralıkları). Platform
# farklı bir vekil/başlık kullanırsa ortam değişkeniyle ayarlanır:
#   SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES (düzenli ifade)
#   SERVER_TOMCAT_REMOTEIP_REMOTEIPHEADER  (ör. cf-connecting-ip)
server.forward-headers-strategy=native

# POSTGRESQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JACKSON
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT — anahtar en az 64 bayt (HS512); üretmek için: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-days=60

# ADMIN — e-posta ve şifre verilirse açılışta admin yoksa oluşturulur;
# verilmezse bu adım atlanır.
admin.seed.username=${ADMIN_SEED_USERNAME:admin}
admin.seed.email=${ADMIN_SEED_EMAIL:}
admin.seed.password=${ADMIN_SEED_PASSWORD:}

# E-POSTA (2.6) — Resend. Anahtar yoksa mail gönderilmez, log'a yazılır.
# Deneme maili: --app.mail.test=adres
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:Decouva <bildirim@decouva.com>}
app.mail.reply-to=${MAIL_REPLY_TO:destek@decouva.com}

# DOSYA YÜKLEME (görseller) — bulut depolama 2.5'te
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ÖRNEK VERİ — üretimde kapalı; geliştirmede yerel dosya açar
app.seed.data=false

# LOG
logging.level.com.foodboxd=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
